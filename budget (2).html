<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weekly Budget</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; min-height: 100vh; font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif; color: #fff; }
  input { background: transparent; border: none; border-bottom: 1px solid #2a2a2a; color: #fff; font-family: inherit; font-size: 15px; font-weight: 500; padding: 2px 0; text-align: right; outline: none; transition: border-color 0.2s; }
  input:focus { border-bottom-color: #fff; }
  button { cursor: pointer; font-family: inherit; }

  /* NAV TABS */
  .nav { display: flex; background: #111; border-bottom: 1px solid #1a1a1a; position: sticky; top: 0; z-index: 100; }
  .nav-btn { flex: 1; padding: 14px 8px; background: none; border: none; color: #444; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; }
  .nav-btn.active { color: #fff; border-bottom-color: #00d084; }

  /* VIEWS */
  .view { display: none; padding-bottom: 130px; }
  .view.active { display: block; }

  /* SHARED */
  .content { max-width: 520px; margin: 0 auto; padding: 0 0 20px; }
  .section { padding: 28px 24px 0; }
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #444; margin-bottom: 14px; }
  .card { background: #111; border-radius: 16px; overflow: hidden; }
  .card-row { display: flex; align-items: center; padding: 14px 20px; border-bottom: 1px solid #1a1a1a; gap: 12px; }
  .card-row:last-child { border-bottom: none; }
  .row-label { flex: 1; }
  .row-label .name { font-size: 15px; font-weight: 500; color: #fff; }
  .row-label .note { font-size: 12px; color: #444; margin-top: 2px; }
  .row-input { display: flex; align-items: center; gap: 4px; }
  .row-input .sym { font-size: 12px; color: #444; }
  .section-total { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px 0; }
  .section-total .label { font-size: 12px; color: #444; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
  .section-total .value { font-size: 16px; font-weight: 700; }

  /* VARIABLE */
  .var-row { padding: 16px 20px; border-bottom: 1px solid #1a1a1a; }
  .var-row:last-child { border-bottom: none; }
  .var-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; flex-wrap: wrap; }
  .var-name { flex: 1; font-size: 15px; font-weight: 500; color: #fff; min-width: 80px; }
  .var-fields { display: flex; align-items: center; gap: 10px; }
  .var-field { display: flex; align-items: center; gap: 4px; }
  .var-field label { font-size: 11px; color: #444; white-space: nowrap; }
  .var-field input { width: 64px; font-size: 13px; }
  .bar-track { background: #1a1a1a; border-radius: 3px; height: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.3s, background 0.3s; }
  .bar-note { font-size: 11px; color: #444; margin-top: 5px; }
  .bar-note.over { color: #ff4d4d; }

  /* FOOTER */
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 1px solid #1a1a1a; z-index: 100; }
  .footer-inner { max-width: 520px; margin: 0 auto; padding: 14px 24px 24px; display: flex; justify-content: space-between; align-items: flex-start; }
  .foot-label { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #444; margin-bottom: 4px; }
  .foot-main { font-size: 30px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .foot-sub { font-size: 12px; color: #444; margin-top: 4px; }
  .foot-right { text-align: right; }
  .foot-right .foot-main { font-size: 18px; letter-spacing: -0.5px; }

  /* HISTORY */
  .week-btn-row { padding: 20px 24px 0; display: flex; align-items: center; gap: 10px; }
  .save-btn { background: #00d084; color: #000; border: none; border-radius: 10px; padding: 10px 20px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; }
  .save-btn:hover { background: #00b572; }
  .week-label-input { background: #111; border: 1px solid #1a1a1a; border-radius: 10px; color: #fff; padding: 10px 14px; font-size: 13px; font-family: inherit; outline: none; flex: 1; }
  .week-label-input:focus { border-color: #2a2a2a; }

  /* HISTORY TABLE */
  .history-wrap { padding: 20px 24px 0; overflow-x: auto; }
  .history-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .history-table th { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #444; padding: 0 12px 10px; text-align: right; white-space: nowrap; }
  .history-table th:first-child { text-align: left; }
  .history-table td { padding: 12px 12px; border-top: 1px solid #1a1a1a; text-align: right; white-space: nowrap; }
  .history-table td:first-child { text-align: left; color: #888; }
  .history-table tr:hover td { background: #111; }
  .del-btn { background: none; border: none; color: #333; font-size: 16px; padding: 0 4px; transition: color 0.2s; }
  .del-btn:hover { color: #ff4d4d; }
  .no-history { padding: 40px 24px; text-align: center; color: #333; font-size: 14px; }

  /* CHART */
  .chart-wrap { padding: 24px 24px 0; }
  .chart-title { font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #444; margin-bottom: 16px; }
  canvas { width: 100% !important; }
  .chart-legend { display: flex; gap: 20px; margin-top: 14px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; }
</style>
</head>
<body>

<!-- NAV -->
<div class="nav">
  <button class="nav-btn active" onclick="showView('budget')">Budget</button>
  <button class="nav-btn" onclick="showView('history')">History</button>
  <button class="nav-btn" onclick="showView('chart')">Chart</button>
</div>

<!-- ═══════════════════════════════════ BUDGET VIEW ═══ -->
<div class="view active" id="view-budget">
  <div class="content">
    <div class="section">
      <div class="section-label">Income</div>
      <div class="card" id="income-card"></div>
      <div class="section-total">
        <span class="label">Total</span>
        <span class="value" style="color:#00d084" id="income-total"></span>
      </div>
    </div>
    <div class="section">
      <div class="section-label">Fixed Expenses</div>
      <div class="card" id="fixed-card"></div>
      <div class="section-total">
        <span class="label">Total</span>
        <span class="value" style="color:#ff4d4d" id="fixed-total"></span>
      </div>
    </div>
    <div class="section">
      <div class="section-label">Variable Spending</div>
      <div class="card" id="variable-card"></div>
      <div class="section-total">
        <span class="label">Total</span>
        <span class="value" style="color:#ff9500" id="variable-total"></span>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════ HISTORY VIEW ═══ -->
<div class="view" id="view-history">
  <div class="content">
    <div class="week-btn-row">
      <input class="week-label-input" id="week-label" placeholder="Week label e.g. Week 1 — 24 May" />
      <button class="save-btn" onclick="saveWeek()">Save Week</button>
    </div>
    <div id="history-output"></div>
  </div>
</div>

<!-- ═══════════════════════════════════ CHART VIEW ═══ -->
<div class="view" id="view-chart">
  <div class="content">
    <div class="chart-wrap">
      <div class="chart-title">Income vs Spending vs Savings</div>
      <canvas id="myChart" height="280"></canvas>
      <div class="chart-legend">
        <div class="legend-item"><div class="legend-dot" style="background:#00d084"></div>Income</div>
        <div class="legend-item"><div class="legend-dot" style="background:#ff4d4d"></div>Spending</div>
        <div class="legend-item"><div class="legend-dot" style="background:#4a9eca"></div>Savings</div>
      </div>
    </div>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <div class="footer-inner">
    <div class="foot-left">
      <div class="foot-label">Weekly Savings</div>
      <div class="foot-main" id="foot-savings"></div>
      <div class="foot-sub" id="foot-rate"></div>
    </div>
    <div class="foot-right">
      <div class="foot-label">Annual</div>
      <div class="foot-main" id="foot-annual"></div>
      <div class="foot-sub" id="foot-out"></div>
    </div>
  </div>
</footer>

<script>
// ── data ─────────────────────────────────────────────────────────────────────
const fmt = (n) => n.toLocaleString('en-AU', { style: 'currency', currency: 'AUD', minimumFractionDigits: 2 });

const income = [
  { id: 'i1', label: 'Tall Tech Noosa Wages', amount: 1887.93 },
  { id: 'i2', label: 'Ochre Health',           amount: 600.00 },
];

const fixed = [
  { id: 'rent',     label: 'Rent',         amount: 670.00,  note: 'Alpha Residential' },
  { id: 'nzmtg',   label: 'NZ Mortgage',   amount: 94.84,   note: 'Top-up transfer' },
  { id: 'power',   label: 'Power',         amount: 35.00,   note: 'Origin Energy' },
  { id: 'water',   label: 'Water',         amount: 15.50,   note: 'Via rent account' },
  { id: 'telstra', label: 'Telstra',        amount: 79.57,   note: '' },
  { id: 'netflix', label: 'Netflix',        amount: 4.58,    note: '' },
  { id: 'stan',    label: 'Stan',           amount: 7.38,    note: '' },
  { id: 'spotify', label: 'Spotify',        amount: 5.77,    note: '' },
  { id: 'insure',  label: 'Insurance',      amount: 27.16,   note: 'Suncorp' },
  { id: 'gym',     label: 'Gym',            amount: 51.44,   note: 'Fitness Cartel' },
  { id: 'ff',      label: 'Flying Fish',    amount: 35.46,   note: 'Swimming' },
  { id: 'beauty',  label: 'Beauty',         amount: 12.95,   note: 'The Lounge Aesthetics' },
  { id: 'pharmacy',label: 'Pharmacy',       amount: 0.00,    note: '' },
  { id: 'petcare', label: 'Pet Care',       amount: 23.86,   note: '' },
  { id: 'school',  label: 'School',         amount: 16.44,   note: 'School24 & P&C' },
];

const variable = [
  { id: 'groceries',     label: 'Groceries',    limit: 400.00, spent: 400.53 },
  { id: 'restaurants',   label: 'Eating Out',   limit: 139.00, spent: 139.00 },
  { id: 'entertainment', label: 'Entertainment',limit: 44.00,  spent: 44.42 },
];

// ── history (localStorage) ────────────────────────────────────────────────────
function loadHistory() {
  try { return JSON.parse(localStorage.getItem('budget_history') || '[]'); } catch(e) { return []; }
}
function saveHistory(h) {
  localStorage.setItem('budget_history', JSON.stringify(h));
}

// ── nav ───────────────────────────────────────────────────────────────────────
function showView(name) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('view-' + name).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => { if (b.textContent.toLowerCase() === name) b.classList.add('active'); });
  if (name === 'history') renderHistory();
  if (name === 'chart') renderChart();
}

// ── build budget ──────────────────────────────────────────────────────────────
function get(id) { return document.getElementById(id); }

function buildIncome() {
  get('income-card').innerHTML = income.map(item => `
    <div class="card-row">
      <div class="row-label"><div class="name">${item.label}</div></div>
      <div class="row-input">
        <span class="sym">$</span>
        <input type="number" step="0.01" value="${item.amount}" data-id="${item.id}" data-type="income" style="color:#00d084;font-weight:600;width:88px;">
        <span class="sym">/wk</span>
      </div>
    </div>`).join('');
}

function buildFixed() {
  get('fixed-card').innerHTML = fixed.map(item => `
    <div class="card-row">
      <div class="row-label">
        <div class="name">${item.label}</div>
        ${item.note ? `<div class="note">${item.note}</div>` : ''}
      </div>
      <div class="row-input">
        <span class="sym">$</span>
        <input type="number" step="0.01" value="${item.amount}" data-id="${item.id}" data-type="fixed" style="width:80px;">
        <span class="sym">/wk</span>
      </div>
    </div>`).join('');
}

function buildVariable() {
  get('variable-card').innerHTML = variable.map(item => {
    const over = item.spent > item.limit;
    const pct  = item.limit > 0 ? Math.min((item.spent / item.limit) * 100, 100) : 0;
    const barCol = over ? '#ff4d4d' : pct > 80 ? '#ff9500' : '#00d084';
    const note = over ? `${fmt(item.spent - item.limit)} over limit` : `${fmt(item.limit - item.spent)} remaining`;
    return `
      <div class="var-row">
        <div class="var-top">
          <div class="var-name">${item.label}</div>
          <div class="var-fields">
            <div class="var-field"><label>limit $</label>
              <input type="number" step="0.01" value="${item.limit}" data-id="${item.id}" data-field="limit" data-type="variable" style="color:#888;">
            </div>
            <div class="var-field"><label>spent $</label>
              <input type="number" step="0.01" value="${item.spent}" data-id="${item.id}" data-field="spent" data-type="variable" style="color:${over?'#ff4d4d':'#fff'};">
            </div>
          </div>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${barCol};"></div></div>
        <div class="bar-note ${over?'over':''}">${note}</div>
      </div>`;
  }).join('');
}

function totals() {
  const inc  = income.reduce((s,i) => s + i.amount, 0);
  const fix  = fixed.reduce((s,f) => s + f.amount, 0);
  const vari = variable.reduce((s,v) => s + v.limit, 0);
  const out  = fix + vari;
  const sav  = inc - out;
  return { inc, fix, vari, out, sav };
}

function recalc() {
  const { inc, fix, vari, out, sav } = totals();
  const rate   = inc > 0 ? (sav / inc * 100) : 0;
  const savCol = sav < 0 ? '#ff4d4d' : sav < 150 ? '#ff9500' : '#00d084';

  get('income-total').textContent   = fmt(inc)  + ' /wk';
  get('fixed-total').textContent    = fmt(fix)  + ' /wk';
  get('variable-total').textContent = fmt(vari) + ' /wk';
  get('foot-savings').textContent   = fmt(sav);
  get('foot-savings').style.color   = savCol;
  get('foot-rate').textContent      = rate.toFixed(1) + '% of income';
  get('foot-annual').textContent    = fmt(sav * 52);
  get('foot-annual').style.color    = savCol;
  get('foot-out').textContent       = fmt(out) + ' out /wk';
}

document.addEventListener('input', e => {
  const { type, id, field } = e.target.dataset;
  const val = parseFloat(e.target.value) || 0;
  if (type === 'income') { const i = income.find(x => x.id === id); if (i) i.amount = val; }
  else if (type === 'fixed') { const f = fixed.find(x => x.id === id); if (f) f.amount = val; }
  else if (type === 'variable') {
    const v = variable.find(x => x.id === id);
    if (v) { v[field] = val; buildVariable(); }
  }
  recalc();
});

// ── save week ─────────────────────────────────────────────────────────────────
function saveWeek() {
  const label = get('week-label').value.trim() || ('Week — ' + new Date().toLocaleDateString('en-AU'));
  const { inc, fix, vari, out, sav } = totals();
  const varDetail = variable.map(v => ({ label: v.label, limit: v.limit, spent: v.spent }));
  const h = loadHistory();
  h.unshift({ label, date: new Date().toISOString(), inc, fix, vari, out, sav, varDetail });
  saveHistory(h);
  get('week-label').value = '';
  renderHistory();
  renderChart();
}

// ── render history ────────────────────────────────────────────────────────────
function renderHistory() {
  const h = loadHistory();
  const el = get('history-output');
  if (!h.length) {
    el.innerHTML = '<div class="no-history">No weeks saved yet.<br>Set your figures on the Budget tab and tap Save Week.</div>';
    return;
  }
  el.innerHTML = `
    <div class="history-wrap">
      <table class="history-table">
        <thead>
          <tr>
            <th>Week</th>
            <th>Income</th>
            <th>Fixed</th>
            <th>Variable</th>
            <th>Total Out</th>
            <th>Savings</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          ${h.map((w, i) => {
            const savCol = w.sav < 0 ? '#ff4d4d' : w.sav < 150 ? '#ff9500' : '#00d084';
            return `<tr>
              <td>${w.label}</td>
              <td style="color:#00d084">${fmt(w.inc)}</td>
              <td>${fmt(w.fix)}</td>
              <td>${fmt(w.vari)}</td>
              <td style="color:#ff4d4d">${fmt(w.out)}</td>
              <td style="color:${savCol};font-weight:700">${fmt(w.sav)}</td>
              <td><button class="del-btn" onclick="deleteWeek(${i})">×</button></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
}

function deleteWeek(i) {
  const h = loadHistory();
  h.splice(i, 1);
  saveHistory(h);
  renderHistory();
  renderChart();
}

// ── chart ─────────────────────────────────────────────────────────────────────
let chartInstance = null;

function renderChart() {
  const h = loadHistory().slice().reverse(); // oldest first
  const canvas = get('myChart');
  const ctx = canvas.getContext('2d');

  if (chartInstance) { chartInstance.destroy(); chartInstance = null; }

  if (!h.length) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#333';
    ctx.font = '14px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Save weeks to see your chart', canvas.width / 2, 120);
    return;
  }

  const labels = h.map(w => w.label);
  const incData = h.map(w => +w.inc.toFixed(2));
  const outData = h.map(w => +w.out.toFixed(2));
  const savData = h.map(w => +w.sav.toFixed(2));

  // manual draw
  const dpr = window.devicePixelRatio || 1;
  const W = canvas.offsetWidth || 460;
  const H = 280;
  canvas.width  = W * dpr;
  canvas.height = H * dpr;
  ctx.scale(dpr, dpr);

  const PAD = { top: 20, right: 20, bottom: 50, left: 60 };
  const cW = W - PAD.left - PAD.right;
  const cH = H - PAD.top  - PAD.bottom;

  const allVals = [...incData, ...outData, ...savData];
  const minVal  = Math.min(...allVals, 0);
  const maxVal  = Math.max(...allVals);
  const range   = maxVal - minVal || 1;

  const xPos = (i) => PAD.left + (h.length === 1 ? cW / 2 : i * cW / (h.length - 1));
  const yPos = (v) => PAD.top  + cH - ((v - minVal) / range) * cH;

  // grid lines
  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth   = 1;
  for (let t = 0; t <= 4; t++) {
    const y = PAD.top + (t / 4) * cH;
    ctx.beginPath(); ctx.moveTo(PAD.left, y); ctx.lineTo(PAD.left + cW, y); ctx.stroke();
    const val = maxVal - (t / 4) * range;
    ctx.fillStyle = '#444'; ctx.font = '10px -apple-system,sans-serif'; ctx.textAlign = 'right';
    ctx.fillText(fmt(val), PAD.left - 6, y + 4);
  }

  // zero line
  if (minVal < 0) {
    const zy = yPos(0);
    ctx.strokeStyle = '#333'; ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(PAD.left, zy); ctx.lineTo(PAD.left + cW, zy); ctx.stroke();
    ctx.setLineDash([]);
  }

  // draw line
  function drawLine(data, color, dash=[]) {
    ctx.strokeStyle = color; ctx.lineWidth = 2.5; ctx.setLineDash(dash);
    ctx.beginPath();
    data.forEach((v, i) => { const x = xPos(i), y = yPos(v); i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); });
    ctx.stroke();
    ctx.setLineDash([]);
    // dots
    data.forEach((v, i) => {
      ctx.beginPath(); ctx.arc(xPos(i), yPos(v), 4, 0, Math.PI*2);
      ctx.fillStyle = color; ctx.fill();
    });
  }

  drawLine(incData, '#00d084');
  drawLine(outData, '#ff4d4d');
  drawLine(savData, '#4a9eca', [6,3]);

  // x labels
  ctx.fillStyle = '#444'; ctx.font = '10px -apple-system,sans-serif'; ctx.textAlign = 'center';
  labels.forEach((l, i) => {
    const short = l.length > 12 ? l.slice(0,12)+'…' : l;
    ctx.fillText(short, xPos(i), H - PAD.bottom + 18);
  });
}

// ── init ──────────────────────────────────────────────────────────────────────
buildIncome(); buildFixed(); buildVariable(); recalc();

// set default week label to current date
const today = new Date();
get('week-label').value = 'Week — ' + today.toLocaleDateString('en-AU', { day:'numeric', month:'short', year:'numeric' });
</script>
</body>
</html>
